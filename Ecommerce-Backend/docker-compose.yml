services:

  eureka-service:
    image: eureka-microservice:v1
    container_name: eureka-service
    ports:
      - "8761:8761"

  identity-service:
    image: identity-microservice:v1
    container_name: identity-service
    ports:
      - "8081:8081"
    depends_on:
      eureka-service:
        condition: service_started
      identity-mysql:
        condition: service_healthy

  identity-mysql:
    image: mysql:8.4
    container_name: identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - identity-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  catalog-service:
    image: catalog-microservice:v1
    container_name: catalog-service
    environment:
      CATALOG_MONGO_HOST: catalog-mongodb
      CATALOG_MONGO_PORT: 27017
      CATALOG_MONGO_DATABASE: ${CATALOG_MONGO_DATABASE}
      CATALOG_MONGO_USERNAME: ${CATALOG_MONGO_USERNAME}
      CATALOG_MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      eureka-service:
        condition: service_started
      catalog-mongodb:
        condition: service_healthy

  catalog-mongodb:
    image: mongo:8
    container_name: catalog-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${CATALOG_MONGO_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${CATALOG_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_MONGO_PASSWORD}
    ports:
      - "${CATALOG_MONGO_PORT}:27017"
    volumes:
      - catalog-mongodb-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inventory-service:
    image: inventory-microservice:v1
    container_name: inventory-service
    environment:
      INVENTORY_DB_HOST: inventory-postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      eureka-service:
        condition: service_started
      inventory-postgres:
        condition: service_healthy

  inventory-postgres:
    image: postgres:17
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "${INVENTORY_DB_PORT}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cart-service:
    image: cart-microservice:v1
    container_name: cart-service
    ports:
      - "8084:8084"
    depends_on:
      eureka-service:
        condition: service_started
      cart-redis:
        condition: service_healthy

  cart-redis:
    image: redis:7
    container_name: cart-redis
    restart: unless-stopped
    ports:
      - "${CART_REDIS_PORT}:6379"
    volumes:
      - cart-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-service:
    image: order-microservice:v1
    container_name: order-service
    environment:
      ORDER_DB_HOST: order-postgres
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "8085:8085"
    depends_on:
      eureka-service:
        condition: service_started
      order-postgres:
        condition: service_healthy

  order-postgres:
    image: postgres:17
    container_name: order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  payment-service:
    image: payment-microservice:v1
    container_name: payment-service
    ports:
      - "8086:8086"
    depends_on:
      eureka-service:
        condition: service_started
      payment-postgres:
        condition: service_healthy

  payment-postgres:
    image: postgres:17
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "${PAYMENT_DB_PORT}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER} -d ${PAYMENT_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification-service:
    image: notification-microservice:v1
    container_name: notification-service
    ports:
      - "8087:8087"
    depends_on:
      eureka-service:
        condition: service_started
      notification-postgres:
        condition: service_healthy

  notification-postgres:
    image: postgres:17
    container_name: notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-service:
    image: ai-microservice:v1
    container_name: ai-service
    environment:
      AI_DB_HOST: ai-postgres
      AI_DB_PORT: 5432
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "8088:8088"
    depends_on:
      eureka-service:
        condition: service_started
      ai-postgres:
        condition: service_healthy

  ai-postgres:
    image: postgres:17
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_DB_NAME}
      POSTGRES_USER: ${AI_DB_USER}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "${AI_DB_PORT}:5432"
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AI_DB_USER} -d ${AI_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    image: api-gateway:v1
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-service:
        condition: service_started


volumes:
  identity-mysql-data:
  catalog-mongodb-data:
  inventory-postgres-data:
  cart-redis-data:
  order-postgres-data:
  payment-postgres-data:
  notification-postgres-data:
  ai-postgres-data: