server:
  port: 8088

spring:
  application:
    name: AI-Microservice

  datasource:
    url: jdbc:postgresql://${AI_DB_HOST:ai-postgres}:${AI_DB_PORT:5432}/${AI_DB_NAME:ai_db}
    username: ${AI_DB_USER:ai_user}
    password: ${AI_DB_PASSWORD:ai_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}