services:

  eureka-service:
    image: eureka-microservice:v1
    container_name: eureka-service
    ports:
      - "8761:8761"

  identity-service:
    image: identity-microservice:v1
    container_name: identity-service
    ports:
      - "8081:8081"
    depends_on:
      identity-mysql:
        condition: service_healthy

  identity-mysql:
    image: mysql:8.4
    container_name: identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - identity-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  catalog-service:
    image: catalog-microservice:v1
    container_name: catalog-service
    environment:
      CATALOG_MONGO_HOST: catalog-mongodb
      CATALOG_MONGO_PORT: 27017
      CATALOG_MONGO_DATABASE: ${CATALOG_MONGO_DATABASE}
      CATALOG_MONGO_USERNAME: ${CATALOG_MONGO_USERNAME}
      CATALOG_MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      catalog-mongodb:
        condition: service_healthy

  catalog-mongodb:
    image: mongo:8
    container_name: catalog-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${CATALOG_MONGO_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${CATALOG_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_MONGO_PASSWORD}
    ports:
      - "${CATALOG_MONGO_PORT}:27017"
    volumes:
      - catalog-mongodb-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inventory-service:
    image: inventory-microservice:v1
    container_name: inventory-service
    environment:
      INVENTORY_DB_HOST: inventory-postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      inventory-postgres:
        condition: service_healthy

  inventory-postgres:
    image: postgres:17
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "${INVENTORY_DB_PORT}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cart-service:
    image: cart-microservice:v1
    container_name: cart-service
    ports:
      - "8084:8084"

  order-service:
    image: order-microservice:v1
    container_name: order-service
    ports:
      - "8085:8085"

  payment-service:
    image: payment-microservice:v1
    container_name: payment-service
    ports:
      - "8086:8086"

  notification-service:
    image: notification-microservice:v1
    container_name: notification-service
    ports:
      - "8087:8087"

  ai-service:
    image: ai-microservice:v1
    container_name: ai-service
    ports:
      - "8088:8088"

  api-gateway:
    image: api-gateway:v1
    container_name: api-gateway
    ports:
      - "8080:8080"


volumes:
  identity-mysql-data:
  catalog-mongodb-data:
  inventory-postgres-data: