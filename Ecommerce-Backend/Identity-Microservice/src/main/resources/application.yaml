server:
  port: 8081

spring:
  application:
    name: Identity-Microservice
  datasource:
    url: jdbc:h2:mem:testdb
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/
  instance:
    prefer-ip-address: true
